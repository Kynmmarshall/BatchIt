name: batchit
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  provider: ^6.1.2
  intl: ^0.20.2
  image_picker: ^1.2.0
  http: ^1.1.0
  google_sign_in: ^6.2.0
  shared_preferences: ^2.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/background/
    - assets/onboaring/
    - assets/batches/
    - assets/team/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
